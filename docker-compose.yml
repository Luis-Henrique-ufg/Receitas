name: receitas

services:
  front-end:
    container_name: front-end
    build: ./frontend
    ports:
      - 5050:4173
    depends_on:
      - back-end
    restart: always

  back-end:
    container_name: back-end
    build: ./backend
    restart: always
    ports:
      - 9823:9823
    volumes:
      - C:\Users\thays\Downloads:/courses:ro