server {
    listen 4173;
    listen [::]:4173;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend routes to the back-end container
    # Using ^~ ensures regex locations (such as static image caching below) do not hijack these paths
    location ^~ /api/ {
        proxy_pass http://back-end:9823;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /serve-content {
        proxy_pass http://back-end:9823;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    location ^~ /serve-video {
        proxy_pass http://back-end:9823;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location ^~ /serve-txt {
        proxy_pass http://back-end:9823;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /serve-files {
        proxy_pass http://back-end:9823;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /uploads/ {
        proxy_pass http://back-end:9823;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /uploads {
        proxy_pass http://back-end:9823;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA: all other routes fall back to index.html with no-cache so updates load immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
